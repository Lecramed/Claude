<title>Sitemap-stad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: kopregel met kerncijfers → 3D-podium met detailpaneel rechts → tabel met alle pagina's.
   Kleur: koel steengrijs als neutraal, mineraal-teal als accent; zwaarder/lichter/nieuw zijn semantisch. */
:root {
  --bg: #eceff1; --surface: #ffffff; --stage: #e2e7ea; --ink: #1b2227; --muted: #5a6670; --line: #d2d9de;
  --accent: #0e7c78; --accent-soft: #d3ece9;
  --up: #cc4a2e; --down: #23905a; --new: #6448cc; --gone: #8b939a; --same: #9aa6ae;
  --t-html: #4f7cac; --t-css: #2f9f9a; --t-js: #d99a2b; --t-img: #c75a7c; --t-font: #8a68c4; --t-media: #b0553a; --t-other: #9aa3ab;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171b; --surface: #1a2026; --stage: #0d1215; --ink: #e4e9ec; --muted: #94a2ac; --line: #2a333b;
  --accent: #3bbab4; --accent-soft: #163a39;
  --up: #ff7b5c; --down: #58d08a; --new: #a28dff; --gone: #6f7880; --same: #5f6d77;
  --t-html: #6f9bd0; --t-css: #47c1bb; --t-js: #f0b44a; --t-img: #e47c9c; --t-font: #ab8ce6; --t-media: #e88a66; --t-other: #7f8a93;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12171b; --surface: #1a2026; --stage: #0d1215; --ink: #e4e9ec; --muted: #94a2ac; --line: #2a333b;
  --accent: #3bbab4; --accent-soft: #163a39;
  --up: #ff7b5c; --down: #58d08a; --new: #a28dff; --gone: #6f7880; --same: #5f6d77;
  --t-html: #6f9bd0; --t-css: #47c1bb; --t-js: #f0b44a; --t-img: #e47c9c; --t-font: #ab8ce6; --t-media: #e88a66; --t-other: #7f8a93;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1600px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- kop ---------- */
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.runs { display: grid; gap: 2px; color: var(--muted); font-size: 13px; min-width: 0; }
.runs b { color: var(--ink); font-weight: 600; }
.runs .mono { font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat .v { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .d { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.stat svg { display: block; margin-top: 4px; }

/* ---------- podium ---------- */
.stage-row { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.stage { position: relative; height: min(80vh, 820px); min-height: 460px; background: var(--stage); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage .hint { position: absolute; left: 12px; bottom: 10px; right: 12px; width: max-content; max-width: calc(100% - 24px); font-size: 12px; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--surface) 82%, transparent); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); }
.legend { position: absolute; left: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 82%, transparent); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); max-width: calc(100% - 24px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.tools button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
.tools button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
#minimap { position: absolute; right: 10px; bottom: 10px; width: 170px; height: 170px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; opacity: .95; }
.stage .hint { top: 50px; bottom: auto; max-width: min(520px, calc(100% - 24px)); width: auto; }
.dash { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 210px); }
.dash > * { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
#speed { font-weight: 600; min-width: 8ch; text-align: right; }
#near { font-weight: 600; }
.touch { position: absolute; left: 12px; right: 190px; bottom: 12px; display: none; justify-content: space-between; pointer-events: none; }
.touch > div { display: flex; gap: 10px; pointer-events: auto; }
.touch button { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 80%, transparent); font-size: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
.touch button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
@media (pointer: coarse) { .touch { display: flex; } .stage .hint { display: none; } .dash { bottom: 84px; } }
.drive { justify-self: start; background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
.fails { font-size: 12px; color: var(--muted); }
.err { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

/* ---------- detailpaneel ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: 14px; padding: 16px; min-width: 0; }
.panel header { display: grid; gap: 4px; }
.panel .path { font-family: var(--f-mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; width: max-content; }
.chip.changed { color: var(--up); } .chip.same { color: var(--muted); } .chip.new { color: var(--new); } .chip.baseline { color: var(--accent); } .chip.removed { color: var(--gone); }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .v { font-family: var(--f-mono); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta { font-family: var(--f-mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.zero { color: var(--muted); font-weight: 400; }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13px; align-items: baseline; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.types { display: grid; grid-template-columns: auto 1fr auto auto; gap: 3px 10px; font-size: 12px; align-items: center; }
.types .num { text-align: right; }
.shots { display: grid; gap: 8px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tabs .pct { margin-left: auto; font-size: 12px; color: var(--muted); align-self: center; }
.shot { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.shot img { display: block; width: 100%; height: auto; }
.res { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12px; }
.res li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.res .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-mono); color: var(--muted); }
.panel a { color: var(--accent); }

/* ---------- tabel ---------- */
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 760px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--bg); }
tbody tr.sel { background: var(--accent-soft); }
td .t { display: inline-block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.minibar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-right: 8px; opacity: .7; }
.foot { color: var(--muted); font-size: 12px; max-width: 75ch; }

@media (max-width: 900px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .legend { top: 50px; }
  .stage .hint { display: none; }
  #minimap { width: 120px; height: 120px; }
  .touch { right: 140px; }
  .dash { max-width: calc(100% - 150px); }
}
@media (max-width: 980px) {
  .stage-row { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 360px; }
}
</style>

<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Sitemap-stad · paginagewicht en wijzigingen</div>
      <h1 id="site-title">KEIGOED</h1>
    </div>
    <div class="runs" id="runs"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="stage-row">
    <div class="stage" id="stage">
      <div class="legend" id="legend"></div>
      <div class="tools">
        <button type="button" id="btn-cam" aria-pressed="false">Achter de auto</button>
        <button type="button" id="btn-home">Naar het plein</button>
      </div>
      <canvas id="minimap" width="200" height="200" aria-label="Plattegrond; klik op een gebouw om erheen te rijden"></canvas>
      <div class="dash"><span id="speed" class="mono">0 km/u</span><span id="near" hidden></span></div>
      <div class="hint">Klik op de stad en rijd met de pijltjes of WASD · Shift = turbo · Spatie = rem · C = camera · R = terug naar start. Gebouwhoogte = paginagewicht, dakkleur = verschil met vorige meting.</div>
      <div class="touch" aria-hidden="true">
        <div><button type="button" data-touch="left">◀</button><button type="button" data-touch="right">▶</button></div>
        <div><button type="button" data-touch="down">▼</button><button type="button" data-touch="up">▲</button></div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section style="display:grid;gap:10px">
    <h2>Alle pagina's</h2>
    <div class="tablebox"><table id="table"><thead></thead><tbody></tbody></table></div>
    <p class="foot" id="foot"></p>
  </section>
</div>

<script>window.REPORT = /*__REPORT_DATA__*/null;</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script>
/* ===== gegevens + 2D-onderdelen (werken ook als WebGL niet beschikbaar is) ===== */
(function () {
  const R = window.REPORT;
  const fmt1 = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmt0 = new Intl.NumberFormat("nl-NL");
  const kb = (b) => (b >= 1048576 ? fmt1.format(b / 1048576) + " MB" : fmt1.format(b / 1024) + " KB");
  const sign = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±");
  const dKB = (b) => (b == null ? "" : Math.abs(b) < 52 ? "±0 KB" : sign(b) + kb(Math.abs(b)));
  const dN = (n) => (n == null ? "" : n === 0 ? "±0" : sign(n) + fmt0.format(Math.abs(n)));
  const dCls = (n, tol = 52) => (n == null || Math.abs(n) < tol ? "zero" : n > 0 ? "up" : "down");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dateFmt = (iso) => new Date(iso).toLocaleString("nl-NL", { dateStyle: "medium", timeStyle: "short" });
  const TYPES = [["html", "HTML"], ["css", "CSS"], ["js", "JavaScript"], ["img", "Afbeeldingen"], ["font", "Fonts"], ["media", "Video"], ["other", "Overig"]];
  const STATUS = { changed: "Gewijzigd", same: "Ongewijzigd", new: "Nieuw", baseline: "Eerste meting", removed: "Verwijderd" };

  function shortName(p) {
    if (p.name) return p.name;
    const q = p.key.match(/\?id=(.+)$/);
    if (q) return decodeURIComponent(q[1]).replace(/-/g, " ").replace(/^./, (c) => c.toUpperCase());
    const t = (p.title || "").split(/\s[—|–-]\s/)[0].trim();
    return t || p.key.replace(/\.html$/, "");
  }
  R.pages.forEach((p) => { p.name = shortName(p); p.state = (p.compare && p.compare.status) || "baseline"; });
  R.removed.forEach((p) => { p.name = shortName(p); p.state = "removed"; });
  window.UTIL = { kb, dKB, dN, dCls, esc, shortName, STATUS, TYPES };

  /* kop */
  const total = R.pages.reduce((s, p) => s + p.weight.transfer, 0);
  const prevTotal = R.history.length > 1 ? R.history[R.history.length - 2].transfer : null;
  const home = R.pages.find((p) => !p.parent) || R.pages[0];
  document.getElementById("site-title").textContent = /^https?:/.test(R.run.base) ? new URL(R.run.base).hostname.replace(/^www\./, "") : home.name || "Website";
  document.getElementById("runs").innerHTML =
    `<div>Deze meting: <b>${esc(dateFmt(R.run.date))}</b> · <span class="mono">${esc(R.run.label)}</span></div>` +
    (R.prev ? `<div>Vorige meting: <b>${esc(dateFmt(R.prev.date))}</b> · <span class="mono">${esc(R.prev.label)}</span></div>` : `<div>Dit is de eerste meting; de volgende wordt hiermee vergeleken.</div>`);

  const count = (s) => R.pages.filter((p) => p.state === s).length;
  const heaviest = R.pages.slice().sort((a, b) => b.weight.transfer - a.weight.transfer)[0];
  const spark = (() => {
    if (R.history.length < 2) return "";
    const w = 120, h = 26, vals = R.history.map((x) => x.transfer);
    const min = Math.min(...vals), max = Math.max(...vals), rng = max - min || 1;
    const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 4) + 2, h - 3 - ((v - min) / rng) * (h - 6)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
    const last = pts[pts.length - 1];
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Totaalgewicht per meting"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>`;
  })();
  const stats = [
    ["Pagina's", fmt0.format(R.pages.length), R.prev ? `${count("new")} nieuw · ${R.removed.length} verwijderd` : "gevonden via links"],
    ["Totaalgewicht", kb(total), prevTotal != null ? `<span class="delta ${dCls(total - prevTotal)}">${dKB(total - prevTotal)}</span> t.o.v. vorige` + spark : "som van alle pagina's"],
    ["Gemiddeld per pagina", kb(total / R.pages.length), `${fmt1.format(R.pages.reduce((s, p) => s + p.weight.requests, 0) / R.pages.length)} requests gemiddeld`],
    ["Zwaarste pagina", kb(heaviest.weight.transfer), esc(heaviest.name)],
    ["Gewijzigd", R.prev ? fmt0.format(count("changed")) : "–", R.prev ? `${count("same")} ongewijzigd` : "nog geen vergelijking"]
  ];
  document.getElementById("stats").innerHTML = stats.map(([l, v, d]) => `<div class="stat"><span class="eyebrow">${l}</span><span class="v">${v}</span><span class="d">${d}</span></div>`).join("");

  document.getElementById("legend").innerHTML = (R.prev
    ? [["--up", "Zwaarder of gewijzigd"], ["--down", "Lichter"], ["--same", "Ongewijzigd"], ["--new", "Nieuw"], ["--gone", "Verwijderd"]]
    : [["--accent", "Eerste meting"]]).map(([c, l]) => `<span><i class="sw" style="background:var(${c})"></i>${l}</span>`).join("");

  /* detailpaneel */
  const panel = document.getElementById("panel");
  let shotTab = "now";
  function renderPanel(key) {
    const p = R.pages.find((x) => x.key === key) || R.removed.find((x) => x.key === key);
    if (!p) return;
    if (p.state === "removed") {
      panel.innerHTML = `<header><span class="chip removed">Verwijderd</span><h2>${esc(p.name)}</h2><div class="path">${esc(p.key)}</div></header>
        <p>Deze pagina bestond bij de vorige meting (${kb(p.transfer)}) maar is nu niet meer bereikbaar via links op de site.</p>
        ${p.prevFull ? `<div class="shot"><img src="${p.prevFull}" alt="Vorige versie van ${esc(p.name)}"></div>` : ""}`;
      return;
    }
    const c = p.compare || {};
    const w = p.weight, has = c.status === "changed" || c.status === "same";
    const bt = w.byType || {};
    const typeRows = TYPES.filter(([t]) => bt[t] || (c.byType && c.byType[t])).map(([t, l]) => {
      const b = (bt[t] || {}).bytes || 0;
      return `<i class="sw" style="background:var(--t-${t})"></i><span>${l} <span class="mono" style="color:var(--muted)">(${(bt[t] || {}).count || 0})</span></span><span class="num">${kb(b)}</span><span class="delta ${has ? dCls(c.byType[t]) : "zero"}">${has ? dKB(c.byType[t] || 0) : ""}</span>`;
    }).join("");
    const bar = TYPES.map(([t]) => ((bt[t] || {}).bytes ? `<i style="width:${(bt[t].bytes / w.transfer) * 100}%;background:var(--t-${t})" title="${t}"></i>` : "")).join("");
    const tabs = [["now", "Nu"]];
    if (p.prevFull) tabs.push(["prev", "Vorige"]);
    if (p.diff) tabs.push(["diff", "Verschil"]);
    if (!tabs.some((t) => t[0] === shotTab)) shotTab = "now";
    const src = { now: p.full, prev: p.prevFull, diff: p.diff }[shotTab];
    panel.innerHTML = `
      <header>
        <span class="chip ${p.state}">${STATUS[p.state]}</span>
        <h2>${esc(p.name)}</h2>
        <div class="path">${esc(p.key)}${p.status && p.status !== 200 ? ` · HTTP ${p.status}` : ""}${p.error ? ` · ${esc(p.error)}` : ""}</div>
        ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" style="font-size:12px">Open de pagina ↗</a>` : ""}
        ${window.SCENE && window.SCENE.driveTo ? `<button type="button" class="drive" data-drive>Rijd hierheen</button>` : ""}
      </header>
      <div>
        <div class="eyebrow">Paginagewicht (overdracht)</div>
        <div class="big"><span class="v">${kb(w.transfer)}</span>${has ? `<span class="delta ${dCls(c.transfer)}">${dKB(c.transfer)}</span><span style="color:var(--muted);font-size:12px">was ${kb(c.prevTransfer)}</span>` : ""}</div>
      </div>
      <dl class="kv">
        <dt>Requests</dt><dd>${w.requests}</dd><dd class="delta ${has ? dCls(c.requests, 1) : "zero"}">${has ? dN(c.requests) : ""}</dd>
        <dt>DOM-elementen</dt><dd>${fmt0.format(p.dom.nodes)}</dd><dd class="delta ${has ? dCls(c.domNodes, 1) : "zero"}">${has ? dN(c.domNodes) : ""}</dd>
        <dt>Inline SVG's</dt><dd>${p.dom.svg}</dd><dd></dd>
        <dt>Paginahoogte</dt><dd>${fmt0.format(p.dom.height)} px</dd><dd class="delta ${has ? dCls(c.height, 1) : "zero"}">${has ? dN(c.height) : ""}</dd>
        <dt>Ongecomprimeerd</dt><dd>${kb(w.decoded)}</dd><dd></dd>
        ${p.timing && p.timing.load ? `<dt>Load (testmachine)</dt><dd>${fmt0.format(p.timing.load)} ms</dd><dd></dd>` : ""}
      </dl>
      <div style="display:grid;gap:8px">
        <div class="bar" role="img" aria-label="Verdeling per type">${bar}</div>
        <div class="types">${typeRows}</div>
      </div>
      <div class="shots">
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === shotTab}">${l}</button>`).join("")}
          ${c.visual != null ? `<span class="pct mono">${fmt1.format(c.visual)}% pixels anders</span>` : ""}</div>
        <div class="shot"><img src="${src}" alt="Screenshot ${esc(p.name)} (${shotTab})"></div>
      </div>
      <div style="display:grid;gap:6px">
        <div class="eyebrow">Grootste bestanden</div>
        <ul class="res">${p.resources.slice(0, 6).map((r) => `<li><i class="sw" style="background:var(--t-${r.type})"></i><span class="u" title="${esc(r.url)}">${esc(r.url.replace(/^https?:\/\/[^/]+\//, (m) => (m.includes("127.0.0.1") ? "/" : m)))}</span><span class="mono">${kb(r.bytes)}</span></li>`).join("")}</ul>
      </div>
      ${p.failed && p.failed.length ? `<div class="fails"><span class="eyebrow">Niet geladen (${p.failed.length})</span><br>${[...new Set(p.failed.map((f) => f.url.split("/")[2]))].map(esc).join(", ")}</div>` : ""}`;
    const dr = panel.querySelector("[data-drive]"); if (dr) dr.addEventListener("click", () => window.SCENE.driveTo(key));
    panel.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { shotTab = b.dataset.tab; renderPanel(key); }));
  }

  /* tabel */
  const cols = [
    ["name", "Pagina", (p) => p.name],
    ["depth", "Niveau", (p) => p.depth ?? -1, true],
    ["transfer", "Gewicht", (p) => p.weight ? p.weight.transfer : p.transfer, true],
    ["dt", "Δ gewicht", (p) => (p.compare && p.compare.transfer) ?? null, true],
    ["req", "Requests", (p) => p.weight ? p.weight.requests : null, true],
    ["dr", "Δ req", (p) => (p.compare && p.compare.requests) ?? null, true],
    ["vis", "Visueel anders", (p) => (p.compare && p.compare.visual) ?? null, true],
    ["state", "Status", (p) => p.state]
  ];
  let sortKey = "transfer", sortDir = -1, selected = null;
  const maxW = Math.max(...R.pages.map((p) => p.weight.transfer));
  function renderTable() {
    const thead = document.querySelector("#table thead"), tbody = document.querySelector("#table tbody");
    thead.innerHTML = "<tr>" + cols.map(([k, l, , n]) => `<th class="${n ? "num" : ""}" data-k="${k}" ${k === sortKey ? `aria-sort="${sortDir < 0 ? "descending" : "ascending"}"` : ""} tabindex="0">${l}${k === sortKey ? (sortDir < 0 ? " ↓" : " ↑") : ""}</th>`).join("") + "</tr>";
    const get = cols.find((c) => c[0] === sortKey)[2];
    const rows = [...R.pages, ...R.removed].sort((a, b) => {
      const x = get(a), y = get(b);
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
    });
    tbody.innerHTML = rows.map((p) => {
      const c = p.compare || {}, w = p.weight;
      const t = w ? w.transfer : p.transfer;
      return `<tr data-key="${esc(p.key)}" class="${p.key === selected ? "sel" : ""}" tabindex="0">
        <td><span class="t">${esc(p.name)}</span> <span class="mono" style="color:var(--muted);font-size:11px">${esc(p.key)}</span></td>
        <td class="num">${p.depth ?? "–"}</td>
        <td class="num"><span class="minibar" style="width:${Math.max(2, (t / maxW) * 70)}px"></span>${kb(t)}</td>
        <td class="num"><span class="delta ${dCls(c.transfer)}">${c.transfer != null ? dKB(c.transfer) : "–"}</span></td>
        <td class="num">${w ? w.requests : "–"}</td>
        <td class="num"><span class="delta ${dCls(c.requests, 1)}">${c.requests != null ? dN(c.requests) : "–"}</span></td>
        <td class="num mono">${c.visual != null ? fmt1.format(c.visual) + "%" : "–"}</td>
        <td><span class="chip ${p.state}">${STATUS[p.state]}</span></td></tr>`;
    }).join("");
    thead.querySelectorAll("th").forEach((th) => {
      const go = () => { if (sortKey === th.dataset.k) sortDir *= -1; else { sortKey = th.dataset.k; sortDir = th.classList.contains("num") ? -1 : 1; } renderTable(); };
      th.addEventListener("click", go); th.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
    tbody.querySelectorAll("tr").forEach((tr) => {
      const go = () => { select(tr.dataset.key, true); document.getElementById("stage").scrollIntoView({ behavior: "smooth", block: "nearest" }); };
      tr.addEventListener("click", go); tr.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
  }
  function select(key, fromList) {
    selected = key;
    renderPanel(key);
    document.querySelectorAll("#table tbody tr").forEach((tr) => tr.classList.toggle("sel", tr.dataset.key === key));
    if (window.SCENE) window.SCENE.select(key, fromList);
  }
  window.selectPage = select;
  document.getElementById("foot").textContent =
    `Gewicht = bytes over het netwerk met een lege cache (viewport ${R.run.viewport.width}×${R.run.viewport.height}), inclusief externe bestanden zoals webfonts. ` +
    `"Visueel anders" vergelijkt de volledige screenshot met die van de vorige meting. Bron: ${R.run.base}.`;
  renderTable();
  select(home.key);
})();
</script>
